{% extends "base.html" %}
{% block title %}Add Student - MyLibrary{% endblock %}

{% block content %}
<div class="add-student-page">
    <header class="page-header">
        <p class="eyebrow">Members</p>
        <h1>Add Student</h1>
        <p class="subtitle">Register a new student in the library system.</p>
    </header>

    <section class="form-section card-section">
        <form method="post" action="{{ url_for('add_student_page') }}" class="add-book-form">
            <div class="form-group">
                <label for="name">Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" required placeholder="e.g. John Doe" class="form-input">
            </div>
            <div class="form-group">
                <label for="class">Class <span class="required">*</span></label>
                <input type="text" id="class" name="class" required placeholder="e.g. CS-A or IT-B" class="form-input">
            </div>
            <div class="form-group">
                <label for="email">Email <span class="required">*</span></label>
                <input type="email" id="email" name="email" required placeholder="e.g. john@college.edu" class="form-input">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Add Student</button>
                <a href="{{ url_for('students') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
