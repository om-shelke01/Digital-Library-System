{% extends "base.html" %}
{% block title %}Add Book - Library Management System{% endblock %}

{% block content %}
<div class="add-book-page">
    <header class="page-header">
        <h1>Add Book</h1>
        <p class="subtitle">Add a new book to the library.</p>
    </header>

    <!-- Card-style section for better focus and readability -->
    <section class="form-section card-section">
        <form method="post" action="{{ url_for('add_book_page') }}" class="add-book-form">
            <div class="form-group">
                <label for="title">Title <span class="required">*</span></label>
                <input type="text" id="title" name="title" required placeholder="e.g. To Kill a Mockingbird" class="form-input">
            </div>
            <div class="form-group">
                <label for="author">Author <span class="required">*</span></label>
                <input type="text" id="author" name="author" required placeholder="e.g. Harper Lee" class="form-input">
            </div>
            <div class="form-group">
                <!-- We use the existing "genre" field as "Class" (no backend changes) -->
                <label for="genre">Class <span class="required">*</span></label>
                <!-- Dropdown to keep class values consistent (still posts as "genre") -->
                <select id="genre" name="genre" required class="form-input">
                    <option value="" disabled selected>-- Select Class --</option>
                    <option value="FY Sem 1">FY Sem 1</option>
                    <option value="FY Sem 2">FY Sem 2</option>
                    <option value="SY Sem 3">SY Sem 3</option>
                    <option value="SY Sem 4">SY Sem 4</option>
                    <option value="TY Sem 5">TY Sem 5</option>
                    <option value="TY Sem 6">TY Sem 6</option>
                    <option value="MCS">MCS</option>
                </select>
            </div>
            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" name="quantity" value="1" min="0" class="form-input">
            </div>
            <div class="form-group">
                <label for="cover_image_url">Cover Image URL <span class="optional">(optional)</span></label>
                <input type="url" id="cover_image_url" name="cover_image_url" placeholder="https://..." class="form-input">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Add Book</button>
                <a href="{{ url_for('books') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
